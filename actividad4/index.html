<!DOCTYPE html>
<html lang="en">

    <h1>Ingrese la talla de pixeles</h1>
    <input id="input" type="text">

<button onclick="


a = document.querySelector('#input').value


        if (a < 576){
            Resultado = document.querySelector('#Resultado')
            Resultado.innerHTML = 'xs'}

        else if(a < 768){
            Resultado = document.querySelector('#Resultado')
            Resultado.innerHTML = 'sm'
}

        else if(a < 962){
            Resultado = document.querySelector('#Resultado')
            Resultado.innerHTML = 'md'
}

        else if(a < 1200){
            Resultado = document.querySelector('#Resultado')
            Resultado.innerHTML = 'xl'
}
        else{
            Resultado = document.querySelector('#Resultado')
            Resultado.innerHTML = 'xxl'
}

"> Verificar </button>

<p id="Resultado">aca estoy y va aparecer el resultado</p>
